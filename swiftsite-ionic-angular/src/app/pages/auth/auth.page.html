<ion-content>
  <main class="screen">
    <div class="logo" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 36 36" fill="none">
        <path d="M13 3C13 3 2.5 14.5 2.5 22a10.5 10.5 0 0 0 21 0C23.5 14.5 13 3 13 3Z" fill="#00E5FF" stroke="#0B1F3A" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M26.5 17.5S20 24 20 28.2a6.5 6.5 0 0 0 13 0c0-4.2-6.5-10.7-6.5-10.7Z" fill="#1E5BD8" stroke="#0B1F3A" stroke-width="2.4" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>{{ register ? 'Crea tu cuenta' : 'Entra a tu cuenta' }}</h1>
    <p class="lead">Para ver tus pedidos y confirmar cotizaciones.</p>

    <div class="segmented" role="tablist">
      <a routerLink="/login" role="tab" [attr.aria-selected]="!register" [class.active]="!register">Iniciar sesión</a>
      <a routerLink="/registro" role="tab" [attr.aria-selected]="register" [class.active]="register">Crear cuenta</a>
    </div>

    <form #form="ngForm" (ngSubmit)="submit()">
      <ng-container *ngIf="register">
        <label for="nombre">Nombre</label>
        <input id="nombre" class="field" name="nombre" [(ngModel)]="datos.nombre" required maxlength="120" autocomplete="name" placeholder="Tu nombre">

        <label for="telefono">Teléfono <span class="optional">(opcional)</span></label>
        <input id="telefono" class="field" name="telefono" [(ngModel)]="datos.telefono" maxlength="25" autocomplete="tel" type="tel" placeholder="7000-0000">
      </ng-container>

      <label for="correo">Correo</label>
      <input id="correo" class="field" type="email" name="correo" [(ngModel)]="datos.correo" required email maxlength="150" autocomplete="username" placeholder="tucorreo@ejemplo.com">

      <label for="clave">Contraseña</label>
      <div class="field password">
        <input id="clave" [type]="verClave ? 'text' : 'password'" name="password" [(ngModel)]="datos.password" required [minlength]="register ? 8 : 1" maxlength="72" [attr.autocomplete]="register ? 'new-password' : 'current-password'" placeholder="••••••••">
        <button type="button" class="eye" [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'" (click)="verClave = !verClave">
          <ssc-icon [name]="verClave ? 'eye-off' : 'eye'" />
        </button>
      </div>

      <ng-container *ngIf="register">
        <label for="confirmacion">Confirmar contraseña</label>
        <input id="confirmacion" class="field" type="password" name="confirmacion" [(ngModel)]="datos.password_confirmation" required autocomplete="new-password" placeholder="••••••••">

        <label class="consent" for="acepta">
          <input id="acepta" type="checkbox" name="acepta_terminos" [(ngModel)]="datos.acepta_terminos" required>
          <span>He leído y acepto los <a routerLink="/terminos" target="_blank" rel="noopener">Términos de uso</a> y el <a routerLink="/privacidad" target="_blank" rel="noopener">Aviso de privacidad</a>, y autorizo el tratamiento de mis datos personales para prestarme el servicio.</span>
        </label>
      </ng-container>

      <p *ngIf="error" role="alert" class="error">{{ error }}</p>

      <button type="submit" class="btn-primary" [disabled]="busy || form.invalid">
        {{ busy ? 'Conectando...' : register ? 'Registrarme' : 'Entrar' }}
      </button>
    </form>

    <div class="divider"><span>o</span></div>
    <a routerLink="/inicio" class="btn-secondary">Seguir como invitado</a>
    <p class="note">Como invitado puedes cotizar. Para confirmar un pedido necesitas cuenta.</p>
  </main>
</ion-content>
